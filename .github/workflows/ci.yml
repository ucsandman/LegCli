name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install context-handoff-bundle
        run: pip install context-handoff-bundle

      - name: Configure git identity (tests init git repos and commit)
        run: |
          git config --global user.email "leg-ci@example.com"
          git config --global user.name "leg-ci"

      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # The docs site is generated and committed, because Vercel serves site/ as
  # static files and runs no build step. An edit to docs/ that never got rebuilt
  # would ship a public page contradicting the package.
  #
  # Its own job so the three-OS test matrix does not each rebuild it. The build
  # reads only the repo's files, never git history, so a shallow checkout is
  # enough and two builds of the same tree are byte-identical.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The committed docs site matches docs/
        run: |
          npm run docs
          if ! git diff --quiet -- site/; then
            echo "site/ is out of date. Run 'npm run docs' and commit the result."
            git diff -- site/
            exit 1
          fi
          echo "site/ is current"

  publish-npm:
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release the publish creates
      id-token: write
    concurrency:
      group: publish-npm-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Check package metadata and registry version
        id: registry
        run: node scripts/npm-publish-gate.mjs

      - name: Publish @ucsandman/legcli to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public --provenance=false

      - name: Publish leg-agents to npm
        if: steps.registry.outputs.alias_published == 'false'
        working-directory: packages/leg-agents
        run: npm publish --access public --provenance=false

      # Every npm version gets a tag and a GitHub release with its CHANGELOG
      # section, in the same job, so the releases page cannot fall behind npm
      # again (it sat at 0.6.0 while npm reached 0.15.1, docs/ERRORS.md
      # 2026-09-19). Idempotent: an existing release is left alone.
      - name: Tag and publish the GitHub release
        if: steps.registry.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$version already exists"
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > /tmp/release-notes.md
          title=$(node scripts/release-notes.mjs "$version" --title)
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/release-notes.md
          echo "released v$version: $title"
