name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install context-handoff-bundle
        run: pip install context-handoff-bundle

      - name: Configure git identity (tests init git repos and commit)
        run: |
          git config --global user.email "baton-ci@example.com"
          git config --global user.name "baton-ci"

      - name: Disable autocrlf on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # The docs site is generated and committed, because Vercel serves site/ as
  # static files and runs no build step. An edit to docs/ that never got rebuilt
  # would ship a public page contradicting the package.
  #
  # Its own job so the three-OS test matrix does not each rebuild it. The build
  # reads only the repo's files, never git history, so a shallow checkout is
  # enough and two builds of the same tree are byte-identical.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The committed docs site matches docs/
        run: |
          npm run docs
          if ! git diff --quiet -- site/; then
            echo "site/ is out of date. Run 'npm run docs' and commit the result."
            git diff -- site/
            exit 1
          fi
          echo "site/ is current"

  publish-npm:
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-npm-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Check package metadata and registry version
        id: registry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          const root = lock.packages?.['']
          ;(async () => {
            const fail = (message) => { throw new Error(message) }
            const expectedRepository = 'https://github.com/ucsandman/baton.git'
            if (!root || pkg.name !== 'baton-agents' || root.name !== pkg.name || root.version !== pkg.version || lock.version !== pkg.version) {
              fail('package.json and package-lock.json root metadata do not match')
            }
            if (pkg.repository?.url !== expectedRepository || root.repository?.url !== expectedRepository) {
              fail('package repository metadata does not match the npm trusted publisher binding')
            }
            const stableVersion = (value) => {
              const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(value)
              if (!match) return null
              const parts = match.slice(1).map(Number)
              return parts.every(Number.isSafeInteger) ? parts : null
            }
            const candidate = stableVersion(pkg.version)
            if (!candidate) fail(`invalid stable package version: ${pkg.version}`)

            const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`
            let response
            try {
              response = await fetch(url, { headers: { Accept: 'application/json' } })
            } catch (error) {
              fail(`npm registry request failed: ${error.message}`)
            }

            if (response.status === 404) {
              let packageResponse
              try {
                packageResponse = await fetch('https://registry.npmjs.org/baton-agents', { headers: { Accept: 'application/json' } })
              } catch (error) {
                fail(`npm package metadata request failed: ${error.message}`)
              }
              if (packageResponse.status !== 200) {
                fail(`npm package metadata returned unexpected status ${packageResponse.status}`)
              }
              let metadata
              try {
                metadata = await packageResponse.json()
              } catch {
                fail('npm package metadata returned invalid JSON')
              }
              const latestText = metadata?.['dist-tags']?.latest
              const latest = stableVersion(latestText)
              if (!latest) fail(`npm latest tag is not a stable version: ${latestText ?? '(missing)'}`)
              const changedPart = candidate.findIndex((part, index) => part !== latest[index])
              const newer = changedPart !== -1 && candidate[changedPart] > latest[changedPart]
              if (!newer) fail(`refusing to publish missing ${pkg.version} because npm latest is ${latestText}`)
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n')
              console.log(`${pkg.name}@${pkg.version} is missing and newer than npm latest ${latestText}; publication is required`)
              return
            }
            if (response.status !== 200) fail(`npm registry returned unexpected status ${response.status}`)
            let published
            try {
              published = await response.json()
            } catch {
              fail('npm registry returned invalid JSON for an existing version')
            }
            if (published?.name !== pkg.name || published?.version !== pkg.version) {
              fail('npm registry response did not match the requested package version')
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n')
            console.log(`${pkg.name}@${pkg.version} already exists; skipping publication`)
          })().catch((error) => {
            console.error(`registry gate failed: ${error.message}`)
            process.exitCode = 1
          })
          NODE

      - name: Publish baton-agents to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public --provenance=false
